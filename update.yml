name: Automatic Portfolio Update
on:
  schedule:
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-update
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market calendar
        run: pip install 'exchange_calendars>=4.5,<5'
      - name: Update portfolio (only while NYSE open)
        run: python update_data.py
      - name: Commit changes if any
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.json
            git commit -m 'Update portfolio market values'
            git push
          fi
